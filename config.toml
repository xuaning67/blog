baseURL = "https://feng-blog.netlify.app/"
title = "fenglei-blog"
theme = "dream"

defaultContentLanguage = "zh"
locale = "zh-Hans"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 8

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.highlight]
      codeFences = true
      guessSyntax = true
      hl_Lines = ""
      lineNoStart = 1
      lineNos = true
      lineNumbersInTable = true
      noClasses = false
      tabWidth = 4

[params]
  # daisyUI 明暗主题，可选项见 https://daisyui.com/docs/themes/
  lightTheme = "emerald"
  darkTheme = "forest"

  # 亮色模式保持干净的纯色背景，避免深色照片导致导航/页脚文字对比度不足
  backgroundImageDark = "/imgs/background-dark.webp"
  images = ["/imgs/avatar.jpg"]

  author = "lfl"
  description = "lfl 的个人博客，用来记录一些乱七八糟的地方。"
  avatar = "/imgs/avatar.webp"
  headerTitle = "lfl"
  motto = "用来记录一些乱七八糟的地方"

  email = "1246556916@qq.com"
  siteStartYear = 2022

  favicon = '<link rel="icon" href="/favicon.png" type="image/png">'

  rss = true
  stickyNav = true
  customSyntaxHighlighting = true

  # 文章页
  showTableOfContents = true
  showSummaryCoverInPost = true
  imageZoomableInPost = true
  showPrevNextPost = true

  [params.advanced]
    customCSS = ["/css/custom.css"]
    # customJS = []

  [params.experimental]
    jsDate = true
    jsDateFormat = "yyyy年MM月dd日"
